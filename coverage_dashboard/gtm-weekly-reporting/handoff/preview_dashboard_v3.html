<title>GTM Weekly Reporting · FY26 Q2</title>
<link rel="icon" href="tricentis-favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root {
  /* shadcn light mode — neutral surfaces, teal primary */
  --background: #ffffff;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --foreground: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --ink-4: #94a3b8;
  --primary: #1e5fbf;
  --primary-hover: #174a96;
  --primary-foreground: #ffffff;
  --primary-soft: #eaf2fd;
  --muted: #f1f5f9;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --ring: #1e5fbf;

  --good: #047857;
  --good-soft: #ecfdf5;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;

  --chart-1: #1e5fbf;
  --chart-2: #5b8def;
  --chart-3: #94a3b8;
  --chart-4: #b45309;
  --chart-5: #b91c1c;

  --radius: 0.625rem;
  --radius-sm: 0.375rem;
  --shadow-card: 0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 3px 0 rgb(15 23 42 / 0.06);
  --shadow-pop: 0 8px 24px -4px rgb(15 23 42 / 0.10), 0 2px 6px -1px rgb(15 23 42 / 0.06);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
  line-height: 1.5;
}

/* ---------- Layout shell ---------- */
.shell { min-height: 100vh; background: var(--background); }
.main { display: flex; flex-direction: column; background: var(--background); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
.brand .logo img { width: 28px; height: 28px; display: block; }
.brand .wordmark { font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; color: var(--foreground); }
.brand .product { display: block; font-size: 11px; color: var(--ink-3); font-weight: 400; margin-top: 1px; }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 40; background: var(--background); border-bottom: 1px solid var(--border); }
.topbar-inner { padding: 0 28px; display: flex; align-items: center; gap: 16px; height: 60px; }
.topbar .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
.topbar .crumb .sep { color: var(--ink-4); }
.topbar .crumb strong { color: var(--foreground); font-weight: 500; }
.topbar .spacer { flex: 1; }
.topbar-meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); }
.topbar-meta .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; }
.topbar-meta .pill .dot { width: 6px; height: 6px; background: var(--good); border-radius: 999px; }
.topbar-meta strong { color: var(--foreground); font-weight: 500; }
.icon-btn { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); width: 34px; height: 34px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.icon-btn:hover { border-color: var(--border-strong); color: var(--foreground); }

/* ---------- Page header ---------- */
.page-head { padding: 24px 28px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.page-head p { margin: 4px 0 0; font-size: 13px; color: var(--ink-3); }

/* Snapshot stamp — clean, monospaced, scannable */
.snap-stamp { display: inline-grid; grid-template-columns: repeat(5, auto); align-items: center; gap: 0; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-card); }
.snap-stamp .cell { padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 130px; }
.snap-stamp .cell + .cell { border-left: 1px solid var(--border); }
.snap-stamp .k { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-4); }
.snap-stamp .v { font-family: var(--mono); font-size: 13px; font-feature-settings: "tnum" 1; color: var(--foreground); font-weight: 500; }
.snap-stamp .v .note { font-family: var(--sans); font-size: 10.5px; color: var(--ink-4); margin-left: 4px; font-weight: 400; }
.snap-stamp .arrow { padding: 0 6px; color: var(--ink-4); font-size: 12px; align-self: center; }

.page { padding: 20px 28px 80px; }

/* ---------- Quarter tabs ---------- */
.tabs { display: inline-flex; background: var(--muted); border: 1px solid var(--border); margin: 20px 0 0; border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.tab { appearance: none; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: var(--ink-3); padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; border-radius: 4px; }
.tab:hover { color: var(--foreground); }
.tab.is-active { background: var(--surface); color: var(--foreground); box-shadow: var(--shadow-card); }
.tab .pill { font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 6px; background: var(--primary); color: var(--primary-foreground); font-weight: 600; border-radius: 4px; }
.tab:not(.is-active) .pill { background: var(--primary-soft); color: var(--primary); }

/* ---------- Filter bar ---------- */
.filter-bar { position: sticky; top: 60px; z-index: 30; background: var(--background); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 16px 0 24px; padding: 12px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-bar .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-4); margin-right: 6px; }
.filter-bar .spacer { flex: 1; }
.filter-bar .reset { appearance: none; border: 0; background: transparent; font: inherit; font-size: 12px; color: var(--ink-3); cursor: pointer; padding: 6px 8px; }
.filter-bar .reset:hover { color: var(--foreground); text-decoration: underline; }
.filter-bar .applied-count { font-size: 12px; color: var(--ink-3); font-family: var(--mono); }
.filter-bar .applied-count strong { color: var(--foreground); font-weight: 500; }

/* Dropdown trigger */
.filter { position: relative; }
.f-trigger { appearance: none; font: inherit; font-size: 13px; background: var(--surface); border: 1px solid var(--border); color: var(--foreground); padding: 6px 10px 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 32px; border-radius: var(--radius-sm); }
.f-trigger:hover { border-color: var(--border-strong); }
.f-trigger.is-active { border-color: var(--foreground); }
.f-trigger .ftxt { font-weight: 500; }
.f-trigger .fcount { font-family: var(--mono); font-size: 11px; color: var(--primary-foreground); background: var(--primary); padding: 1px 6px; line-height: 1.5; border-radius: 999px; }
.f-trigger .fcount.all { background: var(--muted); color: var(--ink-3); }
.f-trigger .chev { color: var(--ink-3); font-size: 10px; }

.f-pop { position: absolute; top: calc(100% + 4px); left: 0; min-width: 260px; max-width: 320px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-pop); z-index: 50; max-height: 360px; overflow: auto; border-radius: var(--radius-sm); }
.f-pop .f-actions { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--ink-3); }
.f-pop .f-actions button { appearance: none; border: 0; background: transparent; font: inherit; font-size: 11px; color: var(--primary); cursor: pointer; padding: 2px 6px; }
.f-pop .f-actions button:hover { text-decoration: underline; }
.f-group { padding: 4px 0; }
.f-group + .f-group { border-top: 1px solid var(--border); }
.f-grouphead { padding: 8px 12px 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-4); display: flex; align-items: center; justify-content: space-between; }
.f-grouphead .pickgroup { font-family: var(--sans); font-size: 10.5px; color: var(--primary); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 500; }
.f-grouphead .pickgroup:hover { text-decoration: underline; }
.f-opt { display: flex; align-items: center; gap: 9px; padding: 6px 12px; font-size: 13px; cursor: pointer; user-select: none; }
.f-opt:hover { background: var(--muted); }
.f-opt input { margin: 0; accent-color: var(--primary); width: 14px; height: 14px; }
.f-opt .opt-meta { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
.f-opt.is-nested { padding-left: 28px; }
.f-opt.is-radio { gap: 9px; }

/* Tree mode */
.f-tree-node { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.f-tree-node:hover { background: #f0f3f7; }
.f-tree-node .tchev { display: inline-flex; width: 12px; justify-content: center; color: var(--ink-3); font-size: 9px; transition: transform 120ms; }
.f-tree-node.is-collapsed .tchev { transform: rotate(-90deg); }
.f-tree-node input { margin: 0; accent-color: var(--primary); width: 14px; height: 14px; }
.f-tree-node .glabel { font-weight: 500; }
.f-tree-node .gcount { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
.f-tree-children { padding: 4px 0; border-bottom: 1px solid var(--border); }
.f-tree-children:last-child { border-bottom: 0; }
.f-tree-children .f-opt { padding-left: 36px; }
.f-tree-empty { padding: 12px 14px; font-size: 12px; color: var(--ink-4); }

/* Active filter chips inline */
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; background: var(--primary-soft); color: var(--foreground); font-size: 11.5px; font-weight: 500; border: 1px solid var(--border); border-radius: 999px; }
.chip button { appearance: none; border: 0; background: transparent; color: var(--primary); cursor: pointer; padding: 0 2px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--foreground); }

/* ---------- KPI cards ---------- */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat { background: var(--surface); border: 1px solid var(--border); padding: 18px 20px; display: flex; flex-direction: column; border-radius: var(--radius); box-shadow: var(--shadow-card); }
.stat .label { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.stat .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; font-feature-settings: "tnum" 1; }
.stat.good .value { color: var(--good); }
.stat.warn .value { color: var(--warn); }
.stat.bad .value  { color: var(--bad); }
.stat .sub { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); margin-top: 6px; flex-wrap: wrap; }
.stat .sub .dot { width: 3px; height: 3px; background: var(--ink-4); }

span.delta { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 1px 7px; border: 1px solid transparent; line-height: 1.5; letter-spacing: -0.01em; border-radius: 999px; }
span.delta.delta-pos  { color: var(--good); background: var(--good-soft); border-color: var(--good-soft); }
span.delta.delta-neg  { color: var(--bad);  background: var(--bad-soft);  border-color: var(--bad-soft); }
span.delta.delta-zero, span.delta.delta-dash { color: var(--ink-3); background: var(--muted); border-color: var(--border); }

/* ---------- Section (collapsible) ---------- */
.section { margin-bottom: 20px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-card); overflow: hidden; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; cursor: pointer; user-select: none; background: var(--surface); border-bottom: 1px solid var(--border); }
.section-head:hover { background: #f3f5f8; }
.section.is-collapsed .section-head { border-bottom: 0; }
.section-head .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.section-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--foreground); }
.section-head .desc { font-size: 12.5px; color: var(--ink-3); }
.section-head .chev { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); transition: transform 120ms; }
.section.is-collapsed .chev { transform: rotate(-90deg); }
.section-head .right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--ink-3); font-family: var(--mono); font-feature-settings: "tnum" 1; }
.section-head .right .mini-kpi b { color: var(--foreground); font-weight: 500; }
.section-head .right .mini-kpi + .mini-kpi { padding-left: 12px; border-left: 1px solid var(--border); }

.section-body { display: block; overflow-x: auto; }
.section.is-collapsed .section-body { display: none; }

/* ---------- Table ---------- */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 10px 16px; text-align: right; vertical-align: middle; white-space: nowrap; }
table.t th.l, table.t td.l { text-align: left; }
table.t thead th { font-size: 12px; font-weight: 500; color: var(--ink-3); border-bottom: 1px solid var(--border); padding-top: 10px; padding-bottom: 10px; background: var(--background); }
table.t thead tr.group-head th { font-size: 10.5px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; padding-top: 12px; padding-bottom: 4px; border-bottom: 0; background: transparent; }
table.t thead tr.group-head th.span { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
table.t thead tr.cols th { padding-top: 8px; }
table.t tbody td { border-bottom: 1px solid var(--border); color: var(--foreground); }
table.t tbody td.num, table.t tbody td.cov, table.t tbody td.delta { font-family: var(--mono); font-size: 12.5px; font-feature-settings: "tnum" 1; }
table.t tbody td.cov.cov-good { color: var(--good); font-weight: 500; }
table.t tbody td.cov.cov-warn { color: var(--warn); font-weight: 500; }
table.t tbody td.cov.cov-bad  { color: var(--bad);  font-weight: 500; }
table.t thead tr.cols th.delta-col,
table.t tbody td.delta-col { text-align: center; }
table.t tbody td.delta { padding: 10px 12px; }
table.t tbody td.delta.delta-pos { color: var(--good); }
table.t tbody td.delta.delta-neg { color: var(--bad); }
table.t tbody td.delta.delta-zero, table.t tbody td.delta.delta-dash, table.t tbody td.cov.cov-dash { color: var(--ink-4); }
table.t th.group-start, table.t td.group-start { border-left: 1px solid var(--border); }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: var(--muted); }

/* Expandable team rows */
table.t tbody tr.row-team td.l { cursor: pointer; user-select: none; }
table.t tbody tr.row-team td.l .row-chev { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-right: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-2); transition: transform 120ms, background 120ms, border-color 120ms; font-size: 10px; vertical-align: -3px; }
table.t tbody tr.row-team td.l:hover .row-chev { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
table.t tbody tr.row-team.is-collapsed td.l .row-chev { transform: rotate(-90deg); }
table.t tbody tr.row-team td { background: var(--surface-2); border-top: 1px solid var(--border-strong); font-weight: 500; }
table.t tbody tr.row-child td.l { padding-left: 42px; color: var(--ink-2); position: relative; cursor: pointer; user-select: none; }
table.t tbody tr.row-child td.l .row-chev { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-right: 6px; border: 1px solid var(--border); background: transparent; color: var(--ink-3); transition: transform 120ms, background 120ms, border-color 120ms, color 120ms; font-size: 9px; vertical-align: -2px; }
table.t tbody tr.row-child td.l:hover .row-chev { border-color: var(--primary); color: var(--primary); }
table.t tbody tr.row-child.is-collapsed td.l .row-chev { transform: rotate(-90deg); }
table.t tbody tr.row-child.has-children td.l { font-weight: 500; color: var(--foreground); }
table.t tbody tr.row-grandchild td.l { padding-left: 70px; color: var(--ink-3); font-size: 12.5px; }
table.t tbody tr.row-grandchild td { background: #fcfcfd; }
table.t tbody tr.row-grandchild td.num, table.t tbody tr.row-grandchild td.cov, table.t tbody tr.row-grandchild td.delta { font-size: 12px; color: var(--ink-2); }
table.t tbody tr.row-subtotal td {
  background: var(--muted-2, #f4f6f8);
  border-top: 1px solid var(--border-strong, #d1d5db);
  font-weight: 500;
}
table.t tbody tr.row-total    td { background: var(--muted); border-top: 1.5px solid var(--foreground); font-weight: 600; padding-top: 12px; padding-bottom: 12px; }

.empty { padding: 32px; text-align: center; color: var(--ink-3); font-size: 13px; background: var(--surface); }
.empty strong { display: block; color: var(--foreground); font-weight: 500; margin-bottom: 4px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) { .summary { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 800px) {
  .page-head { flex-direction: column; }
  .snap-stamp .cell { min-width: 100px; }
  .summary { grid-template-columns: 1fr; }
}

/* Density variants */
body.density-compact table.t th, body.density-compact table.t td { padding-top: 6px; padding-bottom: 6px; }
body.density-compact .stat { padding: 12px 14px; }
body.density-compact .stat .value { font-size: 22px; }
body.density-roomy table.t th, body.density-roomy table.t td { padding-top: 14px; padding-bottom: 14px; }
body.density-roomy .stat { padding: 22px 24px; }
</style>

<script type="text/babel" data-presets="env,react">
const DATA = JSON.parse(document.getElementById('dashboard-data').textContent);
if (!DATA.byQuarter || !DATA.byQuarter[String(DATA.quarter)]) {
  console.error('Dashboard payload missing byQuarter[' + DATA.quarter + ']. Got keys:', Object.keys(DATA));
}

/* ---------- helpers ---------- */
const fmtM = (v) => v == null ? '—' : `$${v.toFixed(1)}`;
const fmtCov = (v) => v == null ? '—' : `${v.toFixed(2)}×`;
const fmtDelta = (v) => {
  if (v == null) return '—';
  if (Math.abs(v) < 0.005) return '±0.00';
  const s = v > 0 ? '+' : '−';
  return `${s}${Math.abs(v).toFixed(2)}`;
};
const covClass = (v) => v == null ? 'cov-dash' : v < 1.5 ? 'cov-bad' : v < 2.5 ? 'cov-warn' : 'cov-good';
const deltaClass = (v) => v == null ? 'delta-dash' : Math.abs(v) < 0.005 ? 'delta-zero' : v > 0 ? 'delta-pos' : 'delta-neg';

/* ---------- Filter dropdown ---------- */
function useClickOutside(ref, onClose) {
  React.useEffect(() => {
    function handler(e) { if (ref.current && !ref.current.contains(e.target)) onClose(); }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [ref, onClose]);
}

function MultiDropdown({ label, options, value, onChange, groupedOptions, tree }) {
  // value: array of selected; empty = "All"
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  useClickOutside(ref, () => setOpen(false));
  const all = options || (groupedOptions ? Object.values(groupedOptions).flat() : []);
  const isAll = value.length === 0 || value.length === all.length;
  const toggle = (opt) => {
    const set = new Set(value.length === 0 ? all : value);
    if (set.has(opt)) set.delete(opt); else set.add(opt);
    const next = [...set];
    onChange(next.length === all.length ? [] : next);
  };
  const selectGroup = (groupItems, e) => {
    e.stopPropagation();
    const set = new Set(value.length === 0 ? all : value);
    const allInGroup = groupItems.every(x => set.has(x));
    if (allInGroup) groupItems.forEach(x => set.delete(x));
    else groupItems.forEach(x => set.add(x));
    const next = [...set];
    onChange(next.length === all.length ? [] : next);
  };
  const selected = value.length === 0 ? all : value;
  return (
    <div className="filter" ref={ref}>
      <button className={`f-trigger ${open || !isAll ? 'is-active' : ''}`} onClick={() => setOpen(!open)}>
        <span className="ftxt">{label}</span>
        <span className={`fcount ${isAll ? 'all' : ''}`}>{isAll ? 'All' : value.length}</span>
        <span className="chev">▾</span>
      </button>
      {open && (
        <div className="f-pop">
          <div className="f-actions">
            <span>{isAll ? `All ${all.length} selected` : `${value.length} of ${all.length}`}</span>
            <div>
              <button onClick={() => onChange([])}>Select all</button>
              <button onClick={() => onChange(all.slice(0,1).map(()=>'__none__'))}>Clear</button>
            </div>
          </div>
          {tree && groupedOptions ? (
            <TreeBody groupedOptions={groupedOptions} selected={selected} toggle={toggle} selectGroup={selectGroup} />
          ) : groupedOptions ? (
            Object.entries(groupedOptions).map(([grp, items]) => (
              <div className="f-group" key={grp}>
                <div className="f-grouphead">
                  <span>{grp}</span>
                  <span className="pickgroup" onClick={(e) => selectGroup(items, e)}>
                    {items.every(x => selected.includes(x)) ? 'clear group' : 'all in group'}
                  </span>
                </div>
                {items.map(opt => (
                  <label className="f-opt is-nested" key={opt}>
                    <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggle(opt)} />
                    <span>{opt}</span>
                  </label>
                ))}
              </div>
            ))
          ) : (
            <div className="f-group">
              {options.map(opt => (
                <label className="f-opt" key={opt}>
                  <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggle(opt)} />
                  <span>{opt}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TreeBody({ groupedOptions, selected, toggle, selectGroup }) {
  const [openGroups, setOpenGroups] = React.useState(() => {
    const o = {}; Object.keys(groupedOptions).forEach(g => { o[g] = true; }); return o;
  });
  const toggleGroup = (g) => setOpenGroups(s => ({ ...s, [g]: !s[g] }));
  return (
    <div>
      {Object.entries(groupedOptions).map(([grp, items]) => {
        const sel = items.filter(x => selected.includes(x)).length;
        const allSel = sel === items.length;
        const noneSel = sel === 0;
        const isOpen = openGroups[grp];
        return (
          <div key={grp}>
            <div className={`f-tree-node ${isOpen ? '' : 'is-collapsed'}`} onClick={() => toggleGroup(grp)}>
              <span className="tchev">▾</span>
              <input
                type="checkbox"
                checked={allSel}
                ref={el => { if (el) el.indeterminate = !allSel && !noneSel; }}
                onClick={(e) => e.stopPropagation()}
                onChange={(e) => { e.stopPropagation(); selectGroup(items, { stopPropagation: () => {} }); }}
              />
              <span className="glabel">{grp}</span>
              <span className="gcount">{sel}/{items.length}</span>
            </div>
            {isOpen && (
              <div className="f-tree-children">
                {items.map(opt => (
                  <label className="f-opt" key={opt} onClick={(e) => e.stopPropagation()}>
                    <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggle(opt)} />
                    <span>{opt}</span>
                  </label>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ---------- Collapsible section ---------- */
function Section({ title, desc, miniKpis, defaultOpen = true, children }) {
  const [open, setOpen] = React.useState(defaultOpen);
  return (
    <section className={`section ${open ? '' : 'is-collapsed'}`}>
      <div className="section-head" onClick={() => setOpen(!open)} role="button" aria-expanded={open}>
        <div className="left">
          <span className="chev">▾</span>
          <h2>{title}</h2>
          {desc && <span className="desc">{desc}</span>}
        </div>
        <div className="right">
          {miniKpis && miniKpis.map((k, i) => (
            <span className="mini-kpi" key={i}>{k.label}: <b>{k.value}</b></span>
          ))}
        </div>
      </div>
      <div className="section-body">{children}</div>
    </section>
  );
}

/* ---------- Quarterly Summary table ---------- */
function QuarterlyTable({ rows, staticRows }) {
  const priorShipped = rows.length > 0 && rows.some(r => r.pipePrior !== undefined);
  // group by geo; team rows nested
  const byGeo = {};
  rows.forEach(r => { (byGeo[r.geo] = byGeo[r.geo] || []).push(r); });
  const [collapsed, setCollapsed] = React.useState({});
  const toggle = (key) => setCollapsed(s => ({ ...s, [key]: s[key] === undefined ? true : !s[key] }));

  // totals
  const tot = rows.reduce((a, r) => ({
    pipe: a.pipe + r.pipe,
    ls: a.ls + r.ls,
    qtd: a.qtd + r.qtd,
    target: a.target + (r.target || 0),
    ltb: a.ltb + (r.ltb || 0),
    pipePrior: a.pipePrior + (r.pipePrior ?? 0),
    lsPrior: a.lsPrior + (r.lsPrior ?? 0),
    qtdPrior: a.qtdPrior + (r.qtdPrior ?? 0),
  }), { pipe: 0, ls: 0, qtd: 0, target: 0, ltb: 0, pipePrior: 0, lsPrior: 0, qtdPrior: 0 });
  const totCov = tot.ltb > 0 ? tot.pipe / tot.ltb : null;
  const totLs = tot.ltb > 0 ? tot.ls / tot.ltb : null;
  const priorLtb = tot.target - tot.qtdPrior;
  const priorTotCov = priorShipped && priorLtb > 0 ? tot.pipePrior / priorLtb : null;
  const priorLsCov = priorShipped && priorLtb > 0 ? tot.lsPrior / priorLtb : null;
  const totCovDelta = (totCov != null && priorTotCov != null) ? totCov - priorTotCov : null;
  const lsCovDelta = (totLs != null && priorLsCov != null) ? totLs - priorLsCov : null;

  if (rows.length === 0) {
    return <div className="empty"><strong>No rows match the current filters.</strong>Try widening Geo or Quarter.</div>;
  }

  return (
    <table className="t">
      <thead>
        <tr className="group-head">
          <th></th><th></th><th></th><th></th><th></th><th></th><th></th>
          <th className="span group-start" colSpan={2}>Total Coverage</th>
          <th className="span group-start" colSpan={2}>LS Coverage</th>
        </tr>
        <tr className="cols">
          <th className="l">Region</th><th className="l">Team</th>
          <th>Total Pipe</th><th>LS Pipe</th><th>QTD Booked</th><th>Target</th><th>LTB</th>
          <th className="group-start">Ratio</th><th className="delta-col">Δ Cov WoW</th>
          <th className="group-start">Ratio</th><th className="delta-col">Δ Cov WoW</th>
        </tr>
      </thead>
      <tbody>
        {Object.entries(byGeo).map(([geo, items]) => {
          const teams = items.filter(r => r.team && r.team !== geo);
          const direct = items.find(r => !r.team || r.team === geo);
          const showHeader = teams.length > 0;
          // geo subtotal
          const sub = items.reduce((a, r) => ({
            pipe: a.pipe + r.pipe, ls: a.ls + r.ls, qtd: a.qtd + r.qtd,
            target: a.target + (r.target || 0), ltb: a.ltb + (r.ltb || 0),
            pipePrior: a.pipePrior + (r.pipePrior ?? 0),
            lsPrior: a.lsPrior + (r.lsPrior ?? 0),
            qtdPrior: a.qtdPrior + (r.qtdPrior ?? 0),
          }), { pipe: 0, ls: 0, qtd: 0, target: 0, ltb: 0, pipePrior: 0, lsPrior: 0, qtdPrior: 0 });
          const subCov = sub.ltb > 0 ? sub.pipe / sub.ltb : null;
          const subLs = sub.ltb > 0 ? sub.ls / sub.ltb : null;
          const subPriorLtb = sub.target - sub.qtdPrior;
          const subPriorTotCov = priorShipped && subPriorLtb > 0 ? sub.pipePrior / subPriorLtb : null;
          const subPriorLsCov = priorShipped && subPriorLtb > 0 ? sub.lsPrior / subPriorLtb : null;
          const subTotDelta = (subCov != null && subPriorTotCov != null) ? subCov - subPriorTotCov : null;
          const subLsDelta = (subLs != null && subPriorLsCov != null) ? subLs - subPriorLsCov : null;
          const isCollapsed = collapsed[geo];

          return (
            <React.Fragment key={geo}>
              {showHeader ? (
                <tr className={`row-team ${isCollapsed ? 'is-collapsed' : ''}`}>
                  <td className="l" onClick={() => toggle(geo)} colSpan={2}>
                    <span className="row-chev">▾</span>{geo}
                    <span style={{color:'var(--ink-4)', fontWeight: 400, marginLeft: 8, fontSize: 11.5}}>
                      {teams.length} team{teams.length === 1 ? '' : 's'}
                    </span>
                  </td>
                  <td className="num">{fmtM(sub.pipe)}</td>
                  <td className="num">{fmtM(sub.ls)}</td>
                  <td className="num">{fmtM(sub.qtd)}</td>
                  <td className="num">{fmtM(sub.target)}</td>
                  <td className="num">{fmtM(sub.ltb)}</td>
                  <td className={`num cov ${covClass(subCov)} group-start`}>{fmtCov(subCov)}</td>
                  <td className={`num delta delta-col ${deltaClass(subTotDelta)}`}>{fmtDelta(subTotDelta)}</td>
                  <td className={`num cov ${covClass(subLs)} group-start`}>{fmtCov(subLs)}</td>
                  <td className={`num delta delta-col ${deltaClass(subLsDelta)}`}>{fmtDelta(subLsDelta)}</td>
                </tr>
              ) : null}
              {!isCollapsed && teams.map((r, i) => {
                const statics = (staticRows || []).filter(s => s.team === r.team);
                const hasKids = statics.length > 1;
                const tKey = geo + '/' + r.team;
                const tCollapsed = collapsed[tKey] !== false; /* default collapsed */
                return (
                  <React.Fragment key={geo + i}>
                    <tr className={`row-child ${hasKids ? 'has-children' : ''} ${tCollapsed ? 'is-collapsed' : ''}`}>
                      <td className="l"></td>
                      <td className="l" onClick={hasKids ? () => toggle(tKey) : undefined}>
                        {hasKids && <span className="row-chev">▾</span>}
                        {r.team}
                        {hasKids && <span style={{color:'var(--ink-4)', fontWeight: 400, marginLeft: 8, fontSize: 11}}>{statics.length} static</span>}
                      </td>
                      <td className="num">{fmtM(r.pipe)}</td>
                      <td className="num">{fmtM(r.ls)}</td>
                      <td className="num">{fmtM(r.qtd)}</td>
                      <td className="num">{fmtM(r.target)}</td>
                      <td className="num">{fmtM(r.ltb)}</td>
                      <td className={`num cov ${covClass(r.totalCov)} group-start`}>{fmtCov(r.totalCov)}</td>
                      <td className={`num delta delta-col ${deltaClass(r.totalDelta)}`}>{fmtDelta(r.totalDelta)}</td>
                      <td className={`num cov ${covClass(r.lsCov)} group-start`}>{fmtCov(r.lsCov)}</td>
                      <td className={`num delta delta-col ${deltaClass(r.lsDelta)}`}>{fmtDelta(r.lsDelta)}</td>
                    </tr>
                    {hasKids && !tCollapsed && statics.map((s, j) => (
                      <tr className="row-grandchild" key={tKey + j}>
                        <td className="l"></td>
                        <td className="l">{s.static}</td>
                        <td className="num">{fmtM(s.pipe)}</td>
                        <td className="num">{fmtM(s.ls)}</td>
                        <td className="num">{fmtM(s.qtd)}</td>
                        <td className="num">{fmtM(s.target)}</td>
                        <td className="num">{fmtM(s.ltb)}</td>
                        <td className={`num cov ${covClass(s.totalCov)} group-start`}>{fmtCov(s.totalCov)}</td>
                        <td className={`num delta delta-col ${deltaClass(s.totalDelta)}`}>{fmtDelta(s.totalDelta)}</td>
                        <td className={`num cov ${covClass(s.lsCov)} group-start`}>{fmtCov(s.lsCov)}</td>
                        <td className={`num delta delta-col ${deltaClass(s.lsDelta)}`}>{fmtDelta(s.lsDelta)}</td>
                      </tr>
                    ))}
                  </React.Fragment>
                );
              })}
              {!showHeader && direct && (
                <tr>
                  <td className="l">{geo}</td>
                  <td className="l"></td>
                  <td className="num">{fmtM(direct.pipe)}</td>
                  <td className="num">{fmtM(direct.ls)}</td>
                  <td className="num">{fmtM(direct.qtd)}</td>

/* ---------- Product table ---------- */
function ProductTable({ rows }) {
  const priorShipped = rows.length > 0 && rows.some(r => r.pipePrior !== undefined);

  rows.forEach(r => { (byProduct[r.product] = byProduct[r.product] || []).push(r); });
  const [collapsed, setCollapsed] = React.useState({});
  const toggle = (k) => setCollapsed(s => ({ ...s, [k]: !s[k] }));
  if (rows.length === 0) {
    return <div className="empty"><strong>No rows match the current filters.</strong>Try widening Product or Geo.</div>;
  }
  return (
    <table className="t">
      <thead>
        <tr className="group-head">
          <th></th><th></th><th></th><th></th><th></th><th></th>

        </tr>
      </thead>
      <tbody>
        {Object.entries(byProduct).map(([prod, items]) => {
          const sub = items.reduce((a, r) => ({
            pipe: a.pipe + r.pipe, ls: a.ls + r.ls, acv: a.acv + r.acv,
            target: a.target + (r.target || 0)
          }), { pipe: 0, ls: 0, acv: 0, target: 0 });
          const subCov = sub.target ? sub.pipe / sub.target : null;
          const subLs = sub.target ? sub.ls / sub.target : null;
          const isCollapsed = collapsed[prod];
          return (
            <React.Fragment key={prod}>
              <tr className={`row-team ${isCollapsed ? 'is-collapsed' : ''}`}>
                <td className="l" colSpan={2} onClick={() => toggle(prod)}>

              {!isCollapsed && items.map((r, i) => (
                <tr className="row-child" key={prod + i}>
                  <td className="l"></td>
                  <td className="l">{r.geo}</td>
                  <td className="num">{fmtM(r.pipe)}</td>
                  <td className="num">{fmtM(r.ls)}</td>
                  <td className="num">{fmtM(r.acv)}</td>
                  <td className="num">{fmtM(r.target)}</td>
                  <td className={`num cov ${covClass(r.totalCov)} group-start`}>{fmtCov(r.totalCov)}</td>
                  <td className={`num delta delta-col ${deltaClass(r.totalDelta)}`}>{fmtDelta(r.totalDelta)}</td>
                  <td className={`num cov ${covClass(r.lsCov)} group-start`}>{fmtCov(r.lsCov)}</td>
                  <td className={`num delta delta-col ${deltaClass(r.lsDelta)}`}>{fmtDelta(r.lsDelta)}</td>
                </tr>
              ))}
            </React.Fragment>
          );
        })}
        {(() => {
          const grand = rows.reduce((a, r) => ({
            pipe: a.pipe + r.pipe,
            ls: a.ls + r.ls,
            acv: a.acv + (r.acv || 0),
            target: a.target + (r.target || 0),
            pipePrior: a.pipePrior + (r.pipePrior ?? 0),
            lsPrior: a.lsPrior + (r.lsPrior ?? 0),
            acvPrior: a.acvPrior + (r.acvPrior ?? 0),
          }), { pipe: 0, ls: 0, acv: 0, target: 0, pipePrior: 0, lsPrior: 0, acvPrior: 0 });
          const ltb = grand.target - grand.acv;
          const totCov = ltb > 0 ? grand.pipe / ltb : null;
          const lsCov = ltb > 0 ? grand.ls / ltb : null;
          const priorLtb = grand.target - grand.acvPrior;
          const priorTot = priorShipped && priorLtb > 0 ? grand.pipePrior / priorLtb : null;
          const priorLs = priorShipped && priorLtb > 0 ? grand.lsPrior / priorLtb : null;
          const totDelta = (totCov != null && priorTot != null) ? totCov - priorTot : null;

}

/* ---------- Summary cards ---------- */
function Summary({ rows, prefetchedKpis }) {
  const useKpi = prefetchedKpis != null && prefetchedKpis.totalPipe != null;
  let totPipe, totLs, totCov, totLsCov, lsPct, totCovDelta, lsCovDelta;
  if (useKpi) {
    totPipe = prefetchedKpis.totalPipe;
    totLs = prefetchedKpis.lsPipe;
    totCov = prefetchedKpis.totalCov;
    totLsCov = prefetchedKpis.lsCov;
    lsPct = prefetchedKpis.lsShare != null
      ? prefetchedKpis.lsShare * 100
      : (totPipe ? (totLs / totPipe * 100) : 0);
    totCovDelta = prefetchedKpis.totalCovDelta;
    lsCovDelta = prefetchedKpis.lsCovDelta;
  } else {
    const tot = rows.reduce((a, r) => ({
      pipe: a.pipe + r.pipe, ls: a.ls + r.ls, ltb: a.ltb + (r.ltb || 0)
    }), { pipe: 0, ls: 0, ltb: 0 });
    totPipe = tot.pipe;
    totLs = tot.ls;
    totCov = tot.ltb ? tot.pipe / tot.ltb : null;
    totLsCov = tot.ltb ? tot.ls / tot.ltb : null;
    lsPct = tot.pipe ? (tot.ls / tot.pipe * 100) : 0;
    totCovDelta = null;
    lsCovDelta = null;
  }
  return (
    <section className="summary">
      <div className="stat">
        <div className="label">Total Pipe</div>
        <div className="value">${totPipe.toFixed(1)}M</div>
        <div className="sub"><span>Open opportunities</span></div>
      </div>
      <div className="stat">
        <div className="label">Late-Stage Pipe</div>
        <div className="value">${totLs.toFixed(1)}M</div>
        <div className="sub"><span>{lsPct.toFixed(1)}% of total</span></div>
      </div>
      <div className={`stat ${totCov == null ? '' : totCov >= 2.5 ? 'good' : totCov >= 1.5 ? 'warn' : 'bad'}`}>
        <div className="label">Total Coverage</div>
        <div className="value">{fmtCov(totCov)}</div>
        <div className="sub">
          <span>Pipe ÷ LTB</span>
          {totCovDelta != null && (
            <span className={`delta ${deltaClass(totCovDelta)}`} style={{ marginLeft: 6 }}>{fmtDelta(totCovDelta)} WoW</span>
          )}
        </div>
      </div>
      <div className={`stat ${totLsCov == null ? '' : totLsCov >= 2.5 ? 'good' : totLsCov >= 1.5 ? 'warn' : 'bad'}`}>
        <div className="label">LS Coverage</div>
        <div className="value">{fmtCov(totLsCov)}</div>
        <div className="sub">
          <span>LS Pipe ÷ LTB</span>
          {lsCovDelta != null && (
            <span className={`delta ${deltaClass(lsCovDelta)}`} style={{ marginLeft: 6 }}>{fmtDelta(lsCovDelta)} WoW</span>
          )}
        </div>
      </div>
    </section>
  );
}

/* ---------- App root ---------- */
function App() {
  const [geos, setGeos] = React.useState([]);
  const [dealTypes, setDealTypes] = React.useState([]);
  const [products, setProducts] = React.useState([]);
  const [quarter, setQuarter] = React.useState(DATA.quarter);

  const qData = (DATA.byQuarter && DATA.byQuarter[String(quarter)]) || {};
  const allRows = qData.rows || [];
  const allStaticRows = qData.staticRows || [];
  const allProductRows = qData.productRows || [];
  const allDealTypeRows = qData.dealTypeRows || [];

  React.useEffect(() => {
    document.querySelectorAll('.tabs .tab').forEach(btn => {
      const q = parseInt(btn.dataset.q, 10);
      btn.classList.toggle('is-active', q === quarter);
      btn.textContent = 'Q' + q;
      if (q === quarter) {
        const pill = document.createElement('span');
        pill.className = 'pill';
        pill.textContent = 'Current';
        btn.appendChild(document.createTextNode(' '));
        btn.appendChild(pill);
      }
      btn.onclick = () => setQuarter(q);
    });
  }, [quarter]);

  React.useEffect(() => {
    const s = DATA.snapshot || {};
    const setCell = (id, text, note) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = '';
      el.appendChild(document.createTextNode(text != null && text !== '' ? String(text) : '—'));
      if (note) {
        const sp = document.createElement('span');
        sp.className = 'note';
        sp.textContent = note;
        el.appendChild(sp);
      }
    };
    setCell('snap-runon', s.runOn || '');
    setCell('snap-live', s.live || '', 'resolved');
    setCell('snap-baseline', s.baseline || '', 'WoW');
    const ra = document.getElementById('snap-runat');
    if (ra) ra.textContent = s.runAt || '—';
  }, []);

  const geosActive = geos.length === 0 ? DATA.geos : geos;
  const dealTypesActive = dealTypes.length === 0 ? DATA.dealTypes : dealTypes;
  const productsActive = products.length === 0 ? DATA.products : products;

  const qRows = allRows.filter(r => geosActive.includes(r.geo));
  const pRows = allProductRows.filter(r =>
    geosActive.includes(r.geo) && productsActive.includes(r.product)
  );
  const dRows = allDealTypeRows.filter(r =>
    geosActive.includes(r.geo) && dealTypesActive.includes(r.dealType)
  );

  const filtersActive = geos.length > 0 || dealTypes.length > 0 || products.length > 0;
  const prefetchedKpis = !filtersActive && DATA.kpisByQuarter
    ? DATA.kpisByQuarter[String(quarter)]
    : null;

  // active chips
  const chips = [];
  if (geos.length) geos.forEach(g => chips.push({ k: 'geo', v: g, label: g, remove: () => setGeos(geos.filter(x => x !== g)) }));
  if (dealTypes.length) dealTypes.forEach(d => chips.push({ k: 'dt', v: d, label: d, remove: () => setDealTypes(dealTypes.filter(x => x !== d)) }));
  if (products.length) products.forEach(p => chips.push({ k: 'p', v: p, label: p, remove: () => setProducts(products.filter(x => x !== p)) }));

  const resetAll = () => { setGeos([]); setDealTypes([]); setProducts([]); };

  return (
    <>
      <div className="filter-bar">
        <span className="label">Filters</span>
        <MultiDropdown label="Geo" options={DATA.geos} value={geos} onChange={setGeos} />
        <MultiDropdown label="Deal Type" options={DATA.dealTypes} value={dealTypes} onChange={setDealTypes} />
        <MultiDropdown label="Product" options={DATA.products} value={products} onChange={setProducts} />
        <span style={{fontSize: 11.5, color: 'var(--ink-4)', marginLeft: 4}}>Bookings Teams: expand a region in the table ↓</span>
        {chips.length > 0 && <div className="chips" style={{marginLeft: 4}}>
          {chips.map((c, i) => <span className="chip" key={i}>{c.label}<button onClick={c.remove} aria-label={`Remove ${c.label}`}>×</button></span>)}
        </div>}
        <div className="spacer"></div>
        <span className="applied-count">Q{quarter} · <strong>{qRows.length}</strong> teams · <strong>{pRows.length}</strong> product rows · <strong>{dRows.length}</strong> deal-type rows</span>
        <button className="reset" onClick={resetAll} disabled={chips.length === 0}>Reset</button>
      </div>

      <Summary rows={qRows} prefetchedKpis={prefetchedKpis} />

      <Section
        title="Quarterly Summary"
        desc="Pipe balance by region & team — $M"
        miniKpis={[
          { label: 'Rows', value: qRows.length },
          { label: 'Δ vs', value: DATA.snapshot.baseline + ' (WoW)' }
        ]}
      >
        <QuarterlyTable rows={qRows} staticRows={allStaticRows} />
      </Section>

      <Section
        title="Product Breakdown"
        desc="Pipe by product × geo — $M"
        miniKpis={[{ label: 'Rows', value: pRows.length }]}
      >
        <ProductTable rows={pRows} />
      </Section>

      <Section
        title="Geo × Deal Type"
        desc="New vs. existing customer pipe by geography — $M"
        miniKpis={[{ label: 'Rows', value: dRows.length }]}
        defaultOpen={false}
      >
        <DealTypeTable rows={dRows} />
      </Section>
    </>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#0b5fad",
  "density": "default"
}/*EDITMODE-END*/;

function Tweaks() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.documentElement.style.setProperty('--primary', tweaks.accent);
    document.documentElement.style.setProperty('--primary-soft', tweaks.accent + '14');
  }, [tweaks.accent]);
  React.useEffect(() => {
    document.body.classList.remove('density-compact', 'density-roomy');
    if (tweaks.density === 'compact') document.body.classList.add('density-compact');
    if (tweaks.density === 'roomy') document.body.classList.add('density-roomy');
  }, [tweaks.density]);
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Brand">
        <TweakColor label="Accent" value={tweaks.accent} onChange={(v) => setTweak('accent', v)} options={['#1f6feb','#0b5fad','#0f172a','#047857']} />
      </TweakSection>
      <TweakSection title="Layout">
        <TweakRadio label="Density" value={tweaks.density} onChange={(v) => setTweak('density', v)} options={[
          { value: 'compact', label: 'Compact' },
          { value: 'default', label: 'Default' },
          { value: 'roomy', label: 'Roomy' }
        ]} />
      </TweakSection>
    </TweaksPanel>
  );
}

function mountTweaks() {
  if (typeof window.useTweaks === 'function' && typeof window.TweaksPanel === 'function') {
    ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<Tweaks />);
    const trig = document.createElement('button');
    trig.textContent = 'Tweaks';
    Object.assign(trig.style, { position: 'fixed', right: '16px', bottom: '16px', zIndex: '60', padding: '8px 14px', font: '500 13px/1 "Geist", system-ui, sans-serif', background: '#0f172a', color: '#fff', border: '1px solid #0f172a', cursor: 'pointer' });
    trig.onclick = () => window.postMessage({ type: '__activate_edit_mode' }, '*');
    document.body.appendChild(trig);
  } else { setTimeout(mountTweaks, 50); }
