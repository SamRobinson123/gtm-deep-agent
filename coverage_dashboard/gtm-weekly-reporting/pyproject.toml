[project]
name = "gtm-weekly-reporting"
version = "0.1.0"
description = "GTM weekly pipeline reporting pulled from Azure Synapse"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyodbc>=5.1",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
