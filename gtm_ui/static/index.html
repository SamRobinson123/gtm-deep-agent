<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM Pipe Analytics</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <div class="brand-name">GTM Pipe Analytics</div>
        <div class="brand-sub" id="brandSub">Q3 FY26</div>
      </div>
    </div>

    <button class="new-chat" id="newChat">New conversation</button>

    <div class="side-head">
      <span>Runs</span>
      <button id="refreshRuns" title="Refresh">&#8635;</button>
    </div>
    <div class="runs" id="runList"></div>

    <div class="side-foot" id="authLine"></div>
  </aside>

  <main class="main">
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <h1>GTM Pipe Analytics</h1>
        <p>Answers come from <code>docs/</code> with citations. Numbers come from
           <code>Target_Monthly.csv</code> and are stored with lineage.</p>
        <div class="suggest">
          <button>Why does Pipe Create have no CloseDate filter?</button>
          <button>What is the Q3 FY26 pipe create target?</button>
          <button>Show weekly pipe create targets for Q3 FY26</button>
          <button>What queries can you run against Synapse?</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask about the Pipe Create model…"></textarea>
        <button id="send" title="Send">&#8593;</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>

</div>
<script src="/app.js"></script>
</body>
</html>
