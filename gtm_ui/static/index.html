<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM Pipe Analytics</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/tricentis-logo.png">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">GTM Pipe Analytics</div>
      <div class="brand-sub" id="brandSub">Q3 FY26</div>
    </div>

    <button class="new-chat" id="newChat">New conversation</button>

    <div class="side-head">
      <span>Runs</span>
      <button id="refreshRuns" title="Refresh runs" aria-label="Refresh runs">&#8635;</button>
    </div>
    <div class="runs" id="runList"></div>

    <div class="side-foot" id="authLine"></div>
  </aside>

  <main class="main">
    <div class="auth hide" id="authBar">
      <span class="pip"></span>
      <span id="authText"></span>
      <button id="authBtn">Sign in</button>
    </div>

    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <h1><img class="mark" src="/tricentis-logo.png" alt="Tricentis"> <span id="greet">What can I help with?</span></h1>
        <p>Every figure is computed from source and traceable to the data and code
           that produced it.</p>
        <!-- data-prompt is the message; the button text is the short pill label. -->
        <div class="suggest">
          <button data-prompt="Why does Pipe Create have no CloseDate filter?">Why no CloseDate filter?</button>
          <button data-prompt="What is the Q4 FY26 pipe create target?">Q4 FY26 target</button>
          <button data-prompt="Recalculate the Q3 and Q4 FY26 targets from current data">Recalculate Q3–Q4 targets</button>
          <button data-prompt="Which territories are flagged as outliers, and what is driving each one?">Flagged territories</button>
          <button data-prompt="What can you query, and am I signed in?">What can you query?</button>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask a question…" aria-label="Message"></textarea>
        <button id="send" title="Send" aria-label="Send">&#8593;</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </main>

</div>
<script src="/app.js"></script>
</body>
</html>
