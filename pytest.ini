[pytest]
# `live` tests spawn the real agent and spend tokens. Excluded by default;
# run them deliberately with:  python -m pytest -m live
addopts = -m "not live"
# Only this repo's suite. coverage_dashboard/ carries its own `tests` package
# (gtm-weekly-reporting), which collides with ours if collected from the root.
testpaths = tests
markers =
    live: spawns the real Claude agent and spends tokens; run explicitly with -m live
